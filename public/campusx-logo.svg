<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" role="img" aria-labelledby="title desc">
  <title id="title">CampusX logo</title>
  <desc id="desc">CampusX white wordmark with coral X accent</desc>
  <defs>
    <style>
      .word {
        font-family: "Segoe UI", Arial, sans-serif;
        font-weight: 700;
        letter-spacing: -4px;
      }
    </style>
  </defs>

  <!-- Coral X accent on far right -->
  <g transform="translate(585 0)">
    <path d="M0 24 L55 24 L118 108 L63 108 Z" fill="#F1A38A"/>
    <path d="M118 24 L173 24 L110 108 L55 108 Z" fill="#F1A38A"/>
  </g>

  <!-- White wordmark -->
  <text x="18" y="126" class="word" font-size="118" fill="#FFFFFF">CampusX</text>
</svg>
